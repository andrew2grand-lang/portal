[project]
name = "local-chat"
version = "0.4.0"
description = "Chat with your own documents using a model that runs on this computer."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "chromadb==0.6.3",
    "pypdf==5.1.0",
    "python-dotenv==1.0.1",
    "ollama==0.4.5",
    "jinja2==3.1.5",
]

[project.scripts]
local-chat = "app.main:run"
