[workspace]
resolver = "3"
members = ["crates/portal-core", "crates/portal-sys", "crates/portal-scan", "src-tauri"]

[workspace.package]
version = "0.5.0-beta.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
portal-core = { path = "crates/portal-core" }
portal-sys = { path = "crates/portal-sys" }

tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto", "pem"] }
ring = "=0.17.14"
png = "=0.18.1"
mdns-sd = "=0.21.5"
netdev = "=0.46.3"
socket2 = { version = "=0.6.5", features = ["all"] }
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-normalization = "=0.1.25"
subtle = "=2.6.1"
filetime = "=0.2.29"
fs4 = { version = "=1.1.0", features = ["sync"] }
dirs = "=7.0.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
libc = "=0.2.190"
tempfile = "=3.27.0"
base64 = "=0.22.1"
# P-256 group arithmetic for SPAKE2 pairing (RFC 9382; the protocol itself is ours, checked against the RFC's vectors)
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic"] }

[profile.release]
codegen-units = 1
lto = "thin"

# Tests move hundreds of MB: optimise dependencies (crypto, hashing) even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
