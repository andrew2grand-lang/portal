[package]
name = "portal-core"
description = "Portal's networking, pairing, transfer and file-safety core. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
portal-sys.workspace = true
base64.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
png.workspace = true
mdns-sd.workspace = true
socket2.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
subtle.workspace = true
p256.workspace = true
filetime.workspace = true
fs4.workspace = true
dirs.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Interface listing: netdev on desktops; on iOS netdev doesn't build (it uses
# libc::in6_ifreq), so the core reads getifaddrs itself (net/iface.rs).
[target.'cfg(not(target_os = "ios"))'.dependencies]
netdev.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio-rustls.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
