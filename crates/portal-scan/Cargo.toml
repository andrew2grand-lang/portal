[package]
name = "portal-scan"
description = "Reads a project folder (never runs it) and writes SeamDrop's honest blocker report for the other OS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "portal-scan"
path = "src/bin/portal-scan.rs"

[dependencies]
# Windows file-name rules, shared with transfers.
portal-core.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tree-sitter = "=0.27.1"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-bash = "=0.25.1"
streaming-iterator = "=0.1.9"
ignore = "=0.4.33"
toml = "=0.9.8"
yaml-rust2 = "=0.13.0"
rayon = "=1.12.0"
schemars = "=1.2.3"
# Only for --online (PyPI's JSON API).
ureq = "=3.4.2"

[dev-dependencies]
tempfile.workspace = true
